# Season boundaries for periodic reports (analysis reports --cadence seasonal).
#
# There is no set-release-date data anywhere in Arena's own logs (checked —
# no releaseDate-shaped field, no patch notes text), so this table is
# maintained by hand. Each season starts on the given date and runs until
# the next entry's start (or indefinitely, for the newest entry). A match
# dated before the earliest entry here falls outside any season and is
# excluded from seasonal reports (but still counted in monthly/annual).
#
# Mystery Booster Commander Edition ("November(?) 2026") is deliberately
# left out until its date — and whether it actually redefines the
# Standard/Limited season the way a normal set release does — is confirmed.

